name: Android Kernel Build

on:
  workflow_dispatch:
  push:
    branches:
      - build-test

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: "snowluna"
      KBUILD_BUILD_HOST: "android-build"
      PATH: $HOME/bin:${{ github.workspace }}/clang/bin:${{ env.PATH }}
      CC: ${{ github.workspace }}/clang/bin/clang
      CROSS_COMPILE: aarch64-linux-android-
      CLANG_TRIPLE: aarch64-linux-gnu-
      CCACHE: ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nano bc bison ca-certificates curl flex gcc git libc6-dev \
            libssl-dev openssl python-is-python3 ssh wget zip zstd make \
            clang gcc-arm-linux-gnueabi software-properties-common build-essential \
            libarchive-tools gcc-aarch64-linux-gnu pigz python3 ccache

      # Cache Clang
      - name: Cache Clang 9.0.3
        uses: actions/cache@v3
        id: cache-clang
        with:
          path: clang
          key: clang-9.0.3

      - name: Download and extract Clang 9.0.3
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android10-dev/clang-r353983c.tar.gz -O clang-r353983c.tar.gz
          mkdir -p clang
          tar -xf clang-r353983c.tar.gz -C clang
          rm clang-r353983c.tar.gz

      # Cache GCC
      - name: Cache GCC 4.9
        uses: actions/cache@v3
        id: cache-gcc
        with:
          path: aarch64-linux-android-4.9
          key: gcc-4.9

      - name: Download and extract GCC 4.9
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android10-dev.tar.gz -O gcc-4.9.tar.gz
          mkdir -p aarch64-linux-android-4.9
          tar -xf gcc-4.9.tar.gz -C aarch64-linux-android-4.9
          rm gcc-4.9.tar.gz

      # Cache ccache
      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Setup ccache wrapper for cross-compiler
        run: |
          mkdir -p $HOME/bin
          cat <<'EOF' > $HOME/bin/aarch64-linux-android-gcc
          #!/bin/bash
          exec ccache $GITHUB_WORKSPACE/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc "$@"
          EOF
          chmod +x $HOME/bin/aarch64-linux-android-gcc

      - name: Show toolchain versions
        run: |
          echo "Clang version:"
          clang --version
          echo "GCC version:"
          aarch64-linux-android-gcc --version
          echo "ccache version:"
          ccache --version

      - name: Build kernel defconfig
        run: |
          make -j$(nproc --all) O=out ARCH=arm64 oppo6765_defconfig

      - name: Build kernel
        run: |
          make -j$(nproc --all) ARCH=arm64 O=out 2>&1 | tee out/build.log

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
            out/build.log

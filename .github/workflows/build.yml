name: Kernel Build

on:
  push:
    branches:
      - build-test
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Download and extract Clang
        run: |
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android10-dev/clang-r353983c.tar.gz
          mkdir clang
          tar -xf clang-r353983c.tar.gz -C clang

      - name: Set up environment and build
        run: |
          export PATH="${PWD}/clang/bin:${PWD}/gcc/aarch64-linux-android-4.9/bin:$PATH"
          export CC="${PWD}/clang/bin/clang"
          export KBUILD_BUILD_USER="snowluna"
          export KBUILD_BUILD_HOST="android-build"

          # Defconfig
          make -j$(nproc --all) O=out ARCH=arm64 oppo6765_defconfig

          # Build
          make -j$(nproc --all) \
            ARCH=arm64 \
            O=out \
            CC="clang" \
            CROSS_COMPILE="${PWD}/gcc/aarch64-linux-android-4.9/bin/aarch64-linux-android-" \
            CLANG_TRIPLE="aarch64-linux-gnu-"

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v3
        with:
          name: Image.gz-dtb
          path: out/arch/arm64/boot/Image.gz-dtb

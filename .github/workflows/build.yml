name: Kernel Build

on:
  push:
    branches:
      - build-test
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libncurses-dev libssl-dev lld llvm make python3 \
            unzip wget xz-utils zip

      - name: Download Clang
        run: |
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r353983c.tar.gz -O clang.tar.gz
          mkdir clang && tar -xf clang.tar.gz -C clang

      - name: Download GCC 4.9
        run: |
          wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android10-dev.tar.gz -O gcc-4.9.tar.gz
          mkdir gcc-4.9 && tar -xf gcc-4.9.tar.gz -C gcc-4.9

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/bin:$PWD/gcc-4.9/bin:$PATH
          mkdir -p out
          make O=out <your_defconfig>
          make -j$(nproc --all) \
            ARCH=arm64 \
            O=out \
            CC="clang" \
            CROSS_COMPILE="${PWD}/gcc-4.9/bin/aarch64-linux-android-" \
            CLANG_TRIPLE="aarch64-linux-gnu-"

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/*.dtb
            out/*.ko
